spring.application.name=fun-demo-warm-flow
# 1. \u6570\u636E\u5E93\u8FDE\u63A5\u4FE1\u606F (\u6839\u636E\u4F60\u7684\u5B9E\u9645\u73AF\u5883\u4FEE\u6539)
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

fun.core.web.response-wrapper.enabled=true
fun.core.web.response-wrapper.ignore-paths[0]=/captchaImage
fun.core.web.response-wrapper.ignore-paths[1]=/getInfo
fun.core.web.response-wrapper.ignore-paths[2]=/login

# warm-flow\u5DE5\u4F5C\u6D41\u914D\u7F6E
# \u662F\u5426\u5F00\u542F\u5DE5\u4F5C\u6D41\uFF0C\u9ED8\u8BA4true
warm-flow.enabled=true
# \u662F\u5426\u663E\u793Abanner\u56FE\uFF0C\u9ED8\u8BA4\u662F
warm-flow.banner=true
# \u662F\u5426\u5F00\u542F\u8BBE\u8BA1\u5668ui\uFF0C\u9ED8\u8BA4true
warm-flow.ui=true
# id\u751F\u6210\u5668\u7C7B\u578B, \u4E0D\u586B\u9ED8\u8BA4\u4E3Aorm\u6269\u5C55\u81EA\u5E26\u751F\u6210\u5668\u6216\u8005warm-flow\u5185\u7F6E\u768419\u4F4D\u96EA\u82B1\u7B97\u6CD5, SnowId14:14\u4F4D\uFF0CSnowId15:15\u4F4D\uFF0C SnowFlake19\uFF1A19\u4F4D
warm-flow.key-type=SnowId19
# \u586B\u5145\u5668\uFF0C\u5185\u90E8\u6709\u9ED8\u8BA4\u5B9E\u73B0\uFF0C\u5982\u679C\u4E0D\u6EE1\u8DB3\u5B9E\u9645\u4E1A\u52A1\uFF0C\u53EF\u901A\u8FC7\u6B64\u914D\u7F6E\u81EA\u5B9A\u4E49\u5B9E\u73B0
#warm-flow.data-fill-handler-path=com.ruoyi.system.handle.CustomDataFillHandler
# \u5168\u5C40\u79DF\u6237\u5904\u7406\u5668\uFF0C\u6709\u591A\u79DF\u6237\u9700\u8981\uFF0C\u53EF\u4EE5\u914D\u7F6E\u81EA\u5B9A\u4E49\u5B9E\u73B0
#warm-flow.tenant-handler-path=com.ruoyi.system.handle.CustomTenantHandler
# \u529E\u7406\u4EBA\u6743\u9650\u5904\u7406\u5668\u7C7B\u8DEF\u5F84
#warm-flow.permission-handler-path=com.warm.flow.handle.CustomPermissionHandler
# \u5168\u5C40\u76D1\u542C\u5668\u7C7B\u8DEF\u5F84
#warm-flow.global-listener-path=com.warm.flow.listener.CustomGlobalListener
# \u662F\u5426\u5F00\u542F\u903B\u8F91\u5220\u9664\uFF08orm\u6846\u67B6\u672C\u8EAB\u4E0D\u652F\u6301\u903B\u8F91\u5220\u9664\uFF0C\u53EF\u901A\u8FC7\u6B64\u8FD9\u79CD\u65B9\u5F0F\u5F00\u542F\uFF09
warm-flow.logic-delete=true
# \u903B\u8F91\u5220\u9664\u5B57\u6BB5\u503C\uFF08\u5F00\u542F\u540E\u9ED8\u8BA4\u4E3A2\uFF09
warm-flow.logic-delete-value=2
## \u5982\u679C\u9700\u8981\u5DE5\u4F5C\u6D41\u5171\u4EAB\u4E1A\u52A1\u7CFB\u7EDF\u6743\u9650\uFF0C\u9ED8\u8BA4Authorization\uFF0C\u5982\u679C\u6709\u591A\u4E2Atoken\uFF0C\u7528\u9017\u53F7\u5206\u9694
warm-flow.token-name=Authorization1
# \u903B\u8F91\u672A\u5220\u9664\u5B57\u6BB5\uFF08\u5F00\u542F\u540E\u9ED8\u8BA4\u4E3A0\uFF09
warm-flow.logic-not-delete-value=0
# \u662F\u5426\u663E\u793A\u6D41\u7A0B\u56FE\u9876\u90E8\u6587\u5B57\uFF0C\u9ED8\u8BA4\u4E3Atrue\uFF1A\u663E\u793A
warm-flow.top-text-show=true
# \u5F53\u4F7F\u7528JPA\u65F6\u6307\u5B9AJpaPersistenceProvider
warm-flow.jpa-persistence-provider=org.springframework.orm.jpa.vendor.SpringHibernateJpaPersistenceProvider
# \u5185\u90E8\u5DF2\u5B9E\u73B0\u81EA\u52A8\u83B7\u53D6\uFF0C\u5931\u6548\u65F6\u4F7F\u7528\u6B64\u914D\u7F6E\uFF08\u5728\u4F7F\u7528mybatis\u6269\u5C55\u5305\u65F6, \u7531\u4E8E\u5404\u6570\u636E\u5E93sql\u8BED\u53E5\u5B58\u5728\u5DEE\u5F02, \u901A\u8FC7\u6B64\u914D\u7F6E\u517C\u5BB9\uFF0C\u9ED8\u8BA4\u4E3Amysql\uFF09
warm-flow.data-source-type=mysql

